# Redirección de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cotiza.netandsoft.com.ve;

    # Desafío ACME para Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cotiza.netandsoft.com.ve;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/cotiza.netandsoft.com.ve/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cotiza.netandsoft.com.ve/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Límite de tamaño de peticiones
    client_max_body_size 10M;

    # Headers de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy hacia el contenedor de Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Rate Limit reforzado para endpoints públicos de envío
    location /api/public/proposals/ {
        limit_req zone=public_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/public/proposals/[^/]+/submit$ {
        limit_req zone=submit_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs específicos del subdominio
    access_log /var/log/nginx/cotiza_access.log;
    error_log /var/log/nginx/cotiza_error.log;
}
