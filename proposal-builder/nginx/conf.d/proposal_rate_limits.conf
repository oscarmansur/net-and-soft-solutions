# =================================================================
# Zonas de Rate Limiting para Proposal Builder
# Colocar en /etc/nginx/conf.d/proposal_rate_limits.conf si Nginx no las tiene
# =================================================================
limit_req_zone $binary_remote_addr zone=public_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=submit_limit:10m rate=2r/s;
