version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netandsoft-proposal-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-https://cotiza.netandsoft.com.ve}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proposal_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proposal_builder}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - FORM_TOKEN_SECRET=${FORM_TOKEN_SECRET}
      - REDIS_URL=redis://redis:6379
      - GHL_ENABLED=${GHL_ENABLED:-false}
      - GHL_WEBHOOK_URL=${GHL_WEBHOOK_URL}
      - GHL_API_KEY=${GHL_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netandsoft-network

  postgres:
    image: postgres:16-alpine
    container_name: netandsoft-proposal-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proposal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-proposal_builder}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proposal_user} -d ${POSTGRES_DB:-proposal_builder}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netandsoft-network

  redis:
    image: redis:7-alpine
    container_name: netandsoft-proposal-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netandsoft-network

  nginx:
    image: nginx:alpine
    container_name: netandsoft-proposal-proxy
    profiles:
      - standalone
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - netandsoft-network

networks:
  netandsoft-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certs_data:
